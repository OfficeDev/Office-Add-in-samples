<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pick a number</title>
    <link rel="stylesheet" href="../taskpane/taskpane.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <main>
      <h1>Pick a number</h1>
      <p>Your choice is sent to the page that opened this dialog.</p>
      <button id="pick-one" type="button" disabled>1</button>
      <button id="pick-two" type="button" disabled>2</button>
      <p id="status" role="status">Waiting for Office...</p>
    </main>
  </body>
</html>
