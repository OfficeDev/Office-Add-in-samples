<html>
    <head>
        <title>Custom functions using WebWorker</title>
        <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js" type="text/javascript"></script>
        <script src="functions.js" type="text/javascript"></script>
        <script type="text/javascript">

        let ballX = 100;
        let ballY = 10;
        let ballDirection = 'downRight';
        let animationTimer;

        function toggleAnimation() {
            const button = document.getElementById('toggle-animation');
            if (animationTimer === undefined) {
                animationTimer = setInterval(drawBall, 10);
                button.textContent = 'Pause animation';
            } else {
                clearInterval(animationTimer);
                animationTimer = undefined;
                button.textContent = 'Resume animation';
            }
        }

         const drawBall = () => {
            const canvas = document.getElementById('mycanvas');

            if (canvas.getContext) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                moveBall(ctx.canvas.width, ctx.canvas.height);
                const radius = 20;

                ctx.beginPath();
                ctx.arc(ballX, ballY, radius, 0, 2*Math.PI, false);
                ctx.fillStyle = 'green';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#003300';
                ctx.stroke();
            }
         }

         const moveBall = (width,height) => {
             //check for ball collision with context boundaries
           
             if (ballX <= 0) {
                 if (ballDirection === 'upLeft') {
                     ballDirection = 'upRight';
                 } else {
                     ballDirection = "downRight";
                 }
             }
            if (ballY <=0) {
                if (ballDirection === 'upLeft') {
                    ballDirection = 'downLeft';

                } else {
                    ballDirection = "downRight";
                }
            }
            if (ballX >= width) {
                if (ballDirection ==='upRight'){
                    ballDirection = 'upLeft';

                } else {
                    ballDirection = 'downLeft';
                }
            }
            if (ballY >= height) {
                if (ballDirection ==='downRight'){
                    ballDirection = 'upRight';
                } else {
                    ballDirection = 'upLeft';
                }
            }
            switch (ballDirection) {
                case 'upRight': {
                    ballX++;
                    ballY--;
                    break;
                }
                case 'upLeft': {
                    ballX--;
                    ballY--;
                    break;
                }
                case 'downRight': {
                    ballX++;
                    ballY++;
                    break;
                }
                case 'downLeft': {
                    ballX--;
                    ballY++;
                    break;
                }
            }
         }

        function initializeAnimation() {
            drawBall();
            const button = document.getElementById('toggle-animation');
            button.onclick = toggleAnimation;
            button.disabled = false;
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                toggleAnimation();
            }
        }

        Office.onReady(function() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initializeAnimation, { once: true });
            } else {
                initializeAnimation();
            }
            console.log("Office.onReady");
        });

        </script>
    </head>
    <body>
        <canvas id="mycanvas" width="200" height="200" role="img"
            aria-label="A bouncing ball demonstrates that the task pane stays responsive while custom functions run in a web worker.">
            A bouncing ball demonstrates that the task pane stays responsive while custom functions run in a web worker.
        </canvas>
        <p><button type="button" id="toggle-animation" disabled>Resume animation</button></p>
    </body>
</html>
